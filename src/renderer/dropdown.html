<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky AI Tasks</title>
    <link rel="stylesheet" href="dropdown.css" />
  </head>
  <body>
    <div class="dropdown">
      <header class="dropdown__header">
        <h3>Today's Tasks</h3>
        <span class="dropdown__count" data-task-count>0 tasks</span>
      </header>

      <button class="dropdown__action" type="button" data-open-all>Open All Notes</button>

      <div class="dropdown__tasks" data-task-list></div>

      <footer class="dropdown__footer">
        <button class="dropdown__quit" type="button" data-quit>Quit Sticky AI</button>
      </footer>
    </div>

    <script src="dropdown.js"></script>
  </body>
</html>
