<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="note">
      <header class="note__titlebar" data-drag-region>
        <div class="note__title">
          <span class="note__title-primary">Sticky</span>
          <span class="note__title-secondary">AI</span>
        </div>
        <button class="note__close" type="button" aria-label="Close note">
          ✕
        </button>
      </header>

      <section class="note__content" contenteditable="true" spellcheck="true"></section>

      <footer class="note__toolbar">
        <div class="note__actions">
          <button class="button" type="button" data-action="new">New Note</button>
          <button class="button button--secondary" type="button" data-action="analyze">
            AI Analyze
          </button>
        </div>
        <div class="note__meta">
          <span class="note__tasks" data-task-count>0 tasks</span>
          <span class="note__status" data-status>Saved</span>
        </div>
      </footer>
    </main>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
